[pytest]
filterwarnings =
    ignore:.*aifc was removed in Python 3.13.*:DeprecationWarning:speech_recognition
    ignore::langchain_core._api.deprecation.LangChainDeprecationWarning
    ignore:.*enablePackrat.*:DeprecationWarning:pyiceberg
    ignore:.*escChar.*:DeprecationWarning:pyiceberg
    ignore:.*unquoteResults.*:DeprecationWarning:pyiceberg
    ignore:.*model_validator.*deprecated.*:DeprecationWarning:pyiceberg
    ignore:.*SwigPyPacked has no __module__ attribute.*:DeprecationWarning
    ignore:.*SwigPyObject has no __module__ attribute.*:DeprecationWarning
    ignore:.*swigvarlink has no __module__ attribute.*:DeprecationWarning
